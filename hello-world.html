<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A fancy Hello World landing page.">
  <title>My Name is M Zeeshan</title>
  <style>
    :root { color-scheme: dark; --ink: #f8fafc; --muted: #b9c5dc; --violet: #8b5cf6; --cyan: #22d3ee; --pink: #f472b6; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; background: #09111f; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .orb { position: fixed; width: 35rem; aspect-ratio: 1; border-radius: 50%; filter: blur(2px); opacity: .34; animation: drift 14s ease-in-out infinite alternate; }
    .orb-one { top: -18rem; left: -12rem; background: var(--violet); }.orb-two { right: -15rem; bottom: -18rem; background: var(--cyan); animation-delay: -6s; }
    .home-nav { position: fixed; z-index: 2; top: 1.25rem; right: 4vw; display: flex; gap: .35rem; padding: .35rem; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; background: rgba(12,22,41,.7); backdrop-filter: blur(14px); }
    .home-nav a { padding: .45rem .75rem; border-radius: 999px; color: var(--muted); font-size: .9rem; font-weight: 700; text-decoration: none; transition: background .2s ease, color .2s ease; }
    .home-nav a:hover, .home-nav a.active { background: rgba(255,255,255,.12); color: var(--ink); }
    main { position: relative; width: min(92vw,760px); padding: clamp(2rem,7vw,5rem); text-align: center; border: 1px solid rgba(255,255,255,.16); border-radius: 28px; background: rgba(12,22,41,.67); box-shadow: 0 28px 80px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.12); backdrop-filter: blur(20px); animation: appear .8s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { display: inline-flex; align-items: center; gap: .55rem; margin: 0 0 1.3rem; color: var(--muted); font-size: .77rem; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; }.spark { color: var(--cyan); font-size: 1rem; }
    h1 { margin: 0; font-size: clamp(3.5rem,11vw,7.5rem); line-height: .95; letter-spacing: -.075em; background: linear-gradient(125deg,#fff 20%,#c4b5fd 52%,#67e8f9 88%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { max-width: 34rem; margin: 1.6rem auto 2.1rem; color: var(--muted); font-size: clamp(1rem,2vw,1.17rem); line-height: 1.7; }
    .button { display: inline-flex; align-items: center; gap: .65rem; padding: .9rem 1.25rem; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; background: linear-gradient(120deg,rgba(139,92,246,.9),rgba(34,211,238,.9)); box-shadow: 0 10px 28px rgba(34,211,238,.2); color: white; font: inherit; font-weight: 700; cursor: pointer; transition: transform .2s ease,box-shadow .2s ease; }.button:hover { transform: translateY(-3px); box-shadow: 0 16px 32px rgba(139,92,246,.33); }.button:active { transform: translateY(-1px); }
    @keyframes appear { from { opacity: 0; transform: translateY(20px) scale(.98); } to { opacity: 1; transform: none; } }@keyframes drift { to { transform: translate(7rem,4rem) scale(1.15); } }@media (max-width:500px) { .home-nav { top: .75rem; right: 50%; transform: translateX(50%); } main { margin-top: 3rem; } }@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="orb orb-one" aria-hidden="true"></div><div class="orb orb-two" aria-hidden="true"></div>
  <nav class="home-nav" aria-label="Main navigation">
    <a class="active" href="hello-world.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="faq.html">FAQ</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <div class="eyebrow"><span class="spark">*</span> A fresh beginning</div>
    <h1>Its Me</h1>
    <p>One small page, a whole universe of possibilities. Welcome to the web - let's make something wonderful. The Blog Section has been tested as much as possible</p>
    <button class="button" type="button" onclick="this.textContent = 'Nice to meet you!'">Say hello <span aria-hidden="true">&rarr;</span></button>
  </main>
</body>
</html>
